services:
  # ---------------------------------------------
  # Redis Cache (Free Tier)
  # ---------------------------------------------
  - type: redis
    name: ecogrid-redis
    ipAllowList: [] # only allow internal connections
    plan: free

  # ---------------------------------------------
  # FastAPI Backend Service
  # ---------------------------------------------
  - type: web
    name: ecogrid-api
    env: python
    buildCommand: pip install .
    startCommand: uvicorn src.api.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: REDIS_URL
        fromService:
          type: redis
          name: ecogrid-redis
          property: connectionString
      - key: PYTHONPATH
        value: .
      # Add ENTSO-E token or TimescaleDB URL here if needed
      # - key: ENTSOE_TOKEN
      #   sync: false
      # - key: TIMESCALE_URL
      #   sync: false

  # ---------------------------------------------
  # React/Vite Frontend (Static Site)
  # ---------------------------------------------
  - type: web
    name: ecogrid-frontend
    env: static
    buildCommand: cd web && npm install && npm run build
    staticPublishPath: ./web/dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: ecogrid-api
          property: host
        # Note: Render provides 'host' without 'https://', so you might need to adjust or prepend in code if necessary, 
        # but Render's `url` property is available on web services in blueprints. Let's use `url` or just construct it.
        # Actually, Render blueprints support `host` or `url` depending on the platform version. Let's provide a static placeholder they can overwrite if needed.
    # Route all requests to index.html for client-side routing
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
